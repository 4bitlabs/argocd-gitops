apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg-operator
  namespace: argocd
  finalizers:
    - argocd.argoproj.io/resources-finalizer
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    targetRevision: 0.21.1
    chart: cloudnative-pg
    helm:
      values: |
        # Instalação do operador CloudNativePG via Helm
        # Este operador será usado para gerenciar clusters PostgreSQL no Kubernetes
        # O operador será instalado no namespace cnpg-system
  
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  
  syncPolicy:
    automated:
      # Remove recursos que existem no cluster mas não estão mais no Git (limpeza automática)
      prune: true
      # Reverte automaticamente mudanças manuais feitas no cluster, mantendo-o alinhado com o Git
      selfHeal: true
      # Impede sincronização quando não há recursos para aplicar (evita aplicações vazias)
      allowEmpty: false
    syncOptions:
      # Cria o namespace de destino automaticamente se ele não existir
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

