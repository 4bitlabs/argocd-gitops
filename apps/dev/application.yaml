apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: saga-dev
  namespace: argocd
  finalizers:
    - argocd.argoproj.io/resources-finalizer
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  
  source:
    repoURL: https://github.com/4bitlabs/saga.git
    targetRevision: develop
    path: helm/saga-chart
    helm:
      releaseName: saga-dev
      valueFiles:
        - values-dev.yaml
      values: |
        # Valores específicos do ambiente de desenvolvimento
        # Podem ser sobrescritos aqui se necessário
  
  destination:
    server: https://kubernetes.default.svc
    namespace: saga-dev
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - Replace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

