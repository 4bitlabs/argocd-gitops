apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: saga-prod
  namespace: argocd
  finalizers:
    - argocd.argoproj.io/resources-finalizer
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Intervalo de verificação do repositório: verifica mudanças no Git a cada 30 segundos
    argocd.argoproj.io/refresh: 30s
spec:
  project: default
  
  source:
    repoURL: https://github.com/4bitlabs/saga.git
    targetRevision: main
    path: helm/saga-chart
    helm:
      releaseName: saga-prod
      valueFiles:
        - values-prod.yaml
      values: |
        # Valores específicos do ambiente de produção
        # Podem ser sobrescritos aqui se necessário
  
  destination:
    server: https://kubernetes.default.svc
    namespace: saga-prod
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - Replace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

